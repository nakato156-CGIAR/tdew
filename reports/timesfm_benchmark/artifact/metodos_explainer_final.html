<!doctype html>
<html lang="es">

<title>Qué hace cada modelo</title>
<style>

body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
.artifact{width:min(100%,1672px);margin:0 auto}

</style>
</head>
<body><div class="artifact"><svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">

  <text x="76" y="94" class="h1">Seis métodos para rellenar un bloque oculto</text>
  <text x="76" y="137" class="lead">Todos reciben la misma entrada — historial de Td y Tmin del período faltante —</text>
  <text x="76" y="168" class="lead">pero difieren en cómo generan los cuatro años sin observaciones.</text>

  <!-- main explainer panel -->
  <rect x="40" y="191" width="1568" height="498" rx="5" class="panel"/>
  <text x="77" y="245" class="h2">La diferencia está en cómo recorren el bloque oculto</text>

  <!-- input card -->
  <rect x="78" y="327" width="273" height="237" rx="5" class="surface" stroke="#31506A" stroke-width="1.2"/>

  <text x="166" y="431" class="body">Historial de Td</text><text x="166" y="453" class="body">hasta 2012</text>

  <rect x="100" y="475" width="228" height="60" rx="5" fill="#132330" stroke="#2B4356"/>
  <rect x="119" y="489" width="8" height="26" rx="4" fill="none" stroke="#78A7D1" stroke-width="2"/>
  <circle cx="123" cy="519" r="7" fill="none" stroke="#78A7D1" stroke-width="2"/>
  <line x1="123" y1="498" x2="123" y2="516" stroke="#78A7D1" stroke-width="2"/>

  <text x="562" y="291" class="h3" fill="#E69F00">SIN MEMORIA</text>
  <text x="562" y="316" class="body">Usa señales contemporáneas o estadísticas fijas;</text>
  <text x="562" y="339" class="body">no mantiene estado dentro del bloque.</text>

  <text x="579" y="372" class="model">climatología · Td = Tmin · zone_ols</text>

  <!-- Family 2 -->
  <circle cx="519" cy="431" r="18" fill="#22C79B"/><text x="519" y="437" text-anchor="middle" class="sans" font-size="17" font-weight="700" fill="#08131B">2</text>
  <text x="562" y="434" class="h3" fill="#22C79B">PASADA ÚNICA</text>
  <text x="562" y="459" class="body">Genera el bloque completo de una sola vez,</text>
  <text x="562" y="482" class="body">sin retroalimentar sus propias salidas.</text>
  <rect x="562" y="495" width="239" height="32" rx="4" fill="#162532"/>

  <text x="562" y="585" class="h3" fill="#3DA8E8">AUTORREGRESIVO</text>

  <text x="562" y="633" class="body">como entrada.</text>

  <g fill="#3DA8E8" font-family="Arial" font-size="18"><text x="1178" y="628">→</text><text x="1245" y="628">→</text><text x="1311" y="628">→</text></g>
  <circle cx="1442" cy="621" r="6" fill="#7894AA"/><circle cx="1477" cy="621" r="6" fill="#7894AA"/><circle cx="1512" cy="621" r="6" fill="#7894AA"/>
  <text x="997" y="659" class="tiny">2012</text><text x="1183" y="670" class="tiny">4 años sin observaciones</text><text x="1491" y="659" class="tiny">2016</text>

  <line x1="40" y1="703" x2="1608" y2="703" stroke="#314552"/>

  <text x="355" y="727" class="serif soft" font-size="15">Qué método destaca en cada categoría (menor RMSE es mejor).</text>

  <line x1="811" y1="744" x2="811" y2="822" stroke="#314552"/>

  <text x="78" y="789" class="result-name" fill="#22C79B">TimesFM 3</text>
  <text x="78" y="816" class="metric">RMSE</text><text x="133" y="817" class="metricv" fill="#22C79B">1.154</text>

  <circle cx="478" cy="769" r="15" fill="#E69F00"/><text x="478" y="775" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#08131B">1</text>

  <text x="510" y="789" class="result-name">climatología</text>
  <text x="510" y="816" class="metric">RMSE</text><text x="565" y="817" class="metricv">1.535</text>

  <!-- result 3 -->
  <circle cx="848" cy="769" r="15" fill="#3DA8E8"/><text x="848" y="775" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#08131B">3</text>
  <text x="880" y="762" class="result-label" fill="#3DA8E8">MEJOR AUTORREGRESIVO</text>
  <text x="880" y="789" class="result-name">Palacios · tuned</text>
  <text x="880" y="816" class="metric">RMSE</text><text x="935" y="817" class="metricv">1.219</text>

  <text x="1222" y="786" class="result-name">TCN directa</text>
  <text x="1222" y="813" class="metric">RMSE</text><text x="1277" y="814" class="metricv" fill="#5AB8F2">0.841</text>

  <!-- how to read -->
  <text x="47" y="875" class="serif ink" font-size="20" font-weight="600">Cómo leer sus cifras</text>
  <line x1="848" y1="849" x2="848" y2="918" stroke="#314552"/>
  <text x="278" y="869" class="sans ink" font-size="14" font-weight="600">Comparables en el muestreo nacional (17,041 celdas)</text>
  <text x="278" y="894" class="sans soft" font-size="14">TimesFM 3, Palacios · tuned, climatología, zone_ols y Td = Tmin.</text>
  <text x="936" y="869" class="sans ink" font-size="14" font-weight="600">TCN directa se reporta aparte</text>
  <text x="936" y="894" class="sans soft" font-size="14">Solo existe en el panel departamental (2,048 celdas), por lo que</text>
  <text x="936" y="915" class="sans soft" font-size="14">no compite directamente en el ranking nacional.</text>
