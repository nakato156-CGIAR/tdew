# DVC pipeline for the existing bronze -> silver -> gold medallion scripts
# under pipeline/ (see pipeline/__init__.py). Only stages for scripts that
# already exist are declared here — no fictitious/placeholder stages.
#
# NOT included yet (deliberately): the Week-1 deep-learning experiment
# pipeline (dataset build for Lima/Cusco/Selva, TCN/GRU/Transformer training)
# planned in the Notion Timeline Planner. Those scripts don't exist yet; add
# stages for them once implemented (see beads tdew-ztn, tdew-x46, tdew-2s6,
# tdew-efi in `bd show <id>`).
#
# `Data/{bronze,silver,gold}` are symlinks to
# /media/ppalacios/Data1/henry_simcast_peru/tdew_medallion/{bronze,silver,gold}
# — the raw .nc files under bronze are themselves symlinks into `_raw/v1_2`
# (already extracted, never zipped on this machine), so there is no
# `spatial_covariables.zip` to depend on; the covariates dep below points at
# the extracted folder instead.
#
# Nothing under Data/ can be `dvc add`-ed: DVC refuses to manage a path
# inside a symlinked directory (see dvc.org/doc/user-guide/troubleshooting
# #add-symlink) — this is exactly why Data/silver/department_grid_ids.dvc
# was orphaned in the past (created before/without this symlink layout) and
# had to be dropped in tdew-ztn.1. So every Data/ path here is a plain
# on-disk dep/out (`cache: false`) instead: dvc.yaml/dvc.lock only reason
# about the pipeline *shape* and staleness via hashes, DVC never caches or
# pushes the actual bytes for any of it.
#
# Every out also sets `persist: true`. Two reasons, both load-bearing:
# 1. These files are on a shared disk owned by another user (ppalacios);
#    we only have group rwx, not ownership. `dvc commit`/`repro` otherwise
#    try to chmod cache:false outs while saving the (separate) run-cache —
#    that chmod requires ownership and fails with "Operation not permitted".
#    `persist: true` disqualifies the stage from run-cache bookkeeping
#    entirely, so that chmod never happens.
# 2. It also stops dvc from deleting outs before re-running `cmd` — the
#    correct behavior here anyway, since bronze/silver/gold are already
#    incremental (extract_daily_var/gold.py skip files that already exist
#    unless `--overwrite` is passed).
stages:
  bronze:
    cmd: uv run python -m pipeline.bronze
    deps:
      - pipeline/bronze.py
      - Data/bronze/spatial_covariables
    outs:
      - Data/bronze/_inventory.csv:
          cache: false
          persist: true

  silver:
    # Scoped to Lima/Cusco/Loreto(Iquitos)/San Martin(Tarapoto) per tdew-ztn.2 —
    # tmin/tmax/td are filtered to these departments' cells instead of the full
    # 2.8M-cell national grid; grid_index/static_covariates/lst_normals stay
    # full-country (cheap, and department_grid_ids/*.csv is itself derived from
    # grid_index.parquet). Drop --departments to go back to full-country.
    cmd: uv run python -m pipeline.silver --departments lima,cusco,iquitos_loreto,tarapoto_san_martin
    deps:
      - pipeline/silver.py
      - Data/bronze/_inventory.csv
      - Data/bronze
      - Data/silver/department_grid_ids
    outs:
      - Data/silver/grid_index.parquet:
          cache: false
          persist: true
      - Data/silver/static_covariates.parquet:
          cache: false
          persist: true
      - Data/silver/lst_normals.parquet:
          cache: false
          persist: true
      - Data/silver/tmin:
          cache: false
          persist: true
      - Data/silver/tmax:
          cache: false
          persist: true
      - Data/silver/td:
          cache: false
          persist: true

  gold:
    cmd: uv run python -m pipeline.gold
    deps:
      - pipeline/gold.py
      - Data/silver/grid_index.parquet
      - Data/silver/static_covariates.parquet
      - Data/silver/lst_normals.parquet
      - Data/silver/tmin
      - Data/silver/tmax
      - Data/silver/td
    outs:
      - Data/gold/model_input:
          cache: false
          persist: true

  # Everything below is the rest of tdew-ztn (tdew-ztn.3): derived features,
  # train-only normalization, sequence-eligibility index, and the QC table.
  # See docs/protocol/week1_manifest.yaml for the frozen split/L definitions.

  features:
    cmd: uv run python -m pipeline.features
    deps:
      - pipeline/features.py
      - Data/gold/model_input
    outs:
      - Data/gold/model_features:
          cache: false
          persist: true

  normalize:
    cmd: uv run python -m pipeline.normalize
    deps:
      - pipeline/normalize.py
      - Data/gold/model_features
    outs:
      - Data/gold/normalization_stats.json:
          cache: false
          persist: true
      - Data/gold/model_features_norm:
          cache: false
          persist: true

  sequences:
    cmd: uv run python -m pipeline.sequences
    deps:
      - pipeline/sequences.py
      - Data/gold/model_features_norm
    outs:
      - Data/gold/sequence_index:
          cache: false
          persist: true

  qc:
    cmd: uv run python -m pipeline.qc
    deps:
      - pipeline/qc.py
      - Data/silver/tmin
      - Data/silver/tmax
      - Data/silver/td
      - Data/silver/department_grid_ids
    outs:
      - Data/qc/qc_table.csv:
          cache: false
          persist: true

  # tdew-x46 (baselines): leak-safe lagged feature table consumed by
  # experiments/baselines/train_baselines.py. Reuses sequence_index/L=31 for
  # run/split-boundary eligibility instead of re-deriving it — see
  # pipeline/baseline_features.py docstring.
  baseline_dataset:
    cmd: uv run python -m pipeline.baseline_features
    deps:
      - pipeline/baseline_features.py
      - Data/gold/model_features_norm
      - Data/gold/sequence_index
    outs:
      - Data/gold/baseline_dataset:
          cache: false
          persist: true
